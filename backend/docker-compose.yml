x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://musafir:musafir@db:5432/musafir
    REDIS_URL: redis://redis:6379/0
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: musafir
      POSTGRES_PASSWORD: musafir
      POSTGRES_DB: musafir
    ports:
      - "5433:5432"  # 5433 on the host to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musafir -d musafir"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *app
    command: celery -A app.workers.celery_app worker -l info
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  beat:
    <<: *app
    command: celery -A app.workers.celery_app beat -l info -s /tmp/celerybeat-schedule
    healthcheck:
      # beat exposes nothing to probe; check the broker it depends on is reachable
      test: ["CMD", "python", "-c", "from app.workers.celery_app import celery_app; celery_app.connection().ensure_connection(max_retries=1)"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
